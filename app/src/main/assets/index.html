function saveRoom(e){e.preventDefault();const rawNumber=$('#r-number').value.trim(),rawBeds=$('#r-beds').value.trim();if(!/^\d+$/.test(rawNumber)||!/^\d+$/.test(rawBeds))return toast('رقم الغرفة وعدد الأسرة يجب أن يكونا أرقاماً صحيحة فقط');let key=Number($('#r-key').value),number=Number(rawNumber),beds=Number(rawBeds);if(!Number.isSafeInteger(number)||number<1||!Number.isSafeInteger(beds)||beds<1||beds>100)return toast('تحقق من رقم الغرفة وعدد الأسرة');if(rooms.some(r=>r.number===number&&r.key!==key))return toast('رقم الغرفة مستخدم بالفعل');let occupants=[...document.querySelectorAll('input[name="occupant"]:checked')].map(x=>Number(x.value));if(occupants.length>beds)return toast('عدد العمال أكبر من عدد الأسرة');let elsewhere=rooms.filter(r=>r.key!==key).flatMap(r=>r.occupants||[]);if(occupants.some(id=>elsewhere.includes(id)))return toast('أحد العمال مسجل في غرفة أخرى');let room={key:key||nextKey(rooms),number,beds,occupants};if(key)rooms=rooms.map(r=>r.key===key?room:r);else rooms.push(room);save('rooms',rooms);toast('تم حفظ الغرفة وتوزيع الأسرة');go('housing')}
function deleteRoom(){let key=Number($('#r-key').value);if(!key)return;let r=rooms.find(x=>x.key===key);if(r&&r.occupants.length)return toast('أخرج العمال من الغرفة قبل حذفها');rooms=rooms.filter(x=>x.key!==key);save('rooms',rooms);toast('تم حذف الغرفة');go('housing')}

function compressReportImage(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve({name:file.name,data:c.toDataURL('image/jpeg',0.72)});};img.onerror=reject;img.src=rd.result;};rd.onerror=reject;rd.readAsDataURL(file);});}

function saveSmartReport(e){e.preventDefault();const key=Number($('#report-worker-key').value);const w=workers.find(x=>Number(x.key)===key);if(!w)return toast('ابحث عن العامل واختره من النتائج أولاً');const reason=$('#report-reason').value.trim();if(!reason)return toast('اكتب تفاصيل الواقعة أولاً');const files=[...($('#report-photo').files||[])].slice(0,3);Promise.all(files.map(compressReportImage)).then(photos=>{const kind=$('#report-kind').value;const labels={discipline:'عقوبة / إنذار',incident:'حادث',inspection:'تقرير معاينة',work:'تقرير عمل'};const room=rooms.find(r=>(r.occupants||[]).some(k=>Number(k)===Number(w.key)));reportDraft={key:null,title:$('#report-title').value.trim()||labels[kind],type:labels[kind]||kind,workerKey:key,date:$('#report-date').value,desc:reason,photos,workerSnapshot:{name:w.name||'',id:w.id||w.employee_number||'',employee_number:w.employee_number||'',job:w.job||w.job_title||'',role:w.role||'',site:w.site||settings.site||'',phone:w.phone||'',status:workerStatus(w)||w.status||'',room:room?room.number:(w.room||w.residence||'')},status:'مسودة'};previewReportKey=null;page='report-preview';render();window.scrollTo(0,0);}).catch(()=>toast('تعذر تجهيز الصور؛ حاول اختيار صور أخرى'));}

function exportData(){let data={product:'HSE CONTROL',version:1,exportedAt:new Date().toISOString(),workers,rooms,shifts,incidents,settings};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hse-control-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')}
function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d||d.product!=='HSE CONTROL')throw Error('bad');workers=Array.isArray(d.workers)?d.workers:[];rooms=Array.isArray(d.rooms)?d.rooms:[];shifts=Array.isArray(d.shifts)?d.shifts:[];incidents=Array.isArray(d.incidents)?d.incidents:[];settings=d.settings||{site:'الموقع الرئيسي'};['workers','rooms','shifts','incidents','settings'].forEach(k=>save(k,eval(k)));toast('تمت استعادة البيانات');render()}catch(err){toast('الملف غير صالح أو ليس نسخة HSE MULTI CATERING')}};reader.readAsText(f)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{if(!authSession)return;const p=b.dataset.page;if(userRole==='manager'&&['manager-dashboard','manager-accounts','manager-add','reports'].includes(p)){page=p;render();window.scrollTo(0,0);if(p==='manager-add')document.getElementById('officer-email')?.focus({preventScroll:true});return}go(p)}));
bootAuth();
</script>
</body>
