 const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
 function cycleInfo(w){const today=todayISO();if(!w.cycleStart)return null;const elapsed=dayDiff(w.cycleStart,today),phase=((elapsed%56)+56)%56,cycleNo=Math.floor(elapsed/56),anchor=new Date(w.cycleStart+'T12:00:00');let leaveStart,leaveEnd,returnDate,daysToLeave;if(elapsed<0){leaveStart=new Date(anchor.getTime()+28*86400000).toISOString().slice(0,10);leaveEnd=new Date(anchor.getTime()+55*86400000).toISOString().slice(0,10);returnDate=new Date(anchor.getTime()+56*86400000).toISOString().slice(0,10);return {status:'حاضر',leaveStart,leaveEnd,returnDate,daysToLeave:dayDiff(today,leaveStart),phase:'قبل بداية الدورة'}}if(phase<28){leaveStart=new Date(anchor.getTime()+(cycleNo*56+28)*86400000).toISOString().slice(0,10);leaveEnd=new Date(new Date(leaveStart+'T12:00:00').getTime()+27*86400000).toISOString().slice(0,10);returnDate=new Date(new Date(leaveEnd+'T12:00:00').getTime()+86400000).toISOString().slice(0,10);return {status:'حاضر',leaveStart,leaveEnd,returnDate,daysToLeave:dayDiff(today,leaveStart),phase:'عمل'}}leaveStart=new Date(anchor.getTime()+(cycleNo*56+28)*86400000).toISOString().slice(0,10);leaveEnd=new Date(new Date(leaveStart+'T12:00:00').getTime()+27*86400000).toISOString().slice(0,10);returnDate=new Date(new Date(leaveEnd+'T12:00:00').getTime()+86400000).toISOString().slice(0,10);const nextLeave=new Date(new Date(returnDate+'T12:00:00').getTime()+27*86400000).toISOString().slice(0,10);return {status:'إجازة',leaveStart,leaveEnd,returnDate,daysToLeave:0,nextLeave,phase:'إجازة'}}

function stat(label,num,ico,hint){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="ico">'+ico+'</span></div><div class="num">'+num+'</div><div class="hint">'+hint+'</div></div>'}
function module(ico,title,desc,target){return '<button class="module" onclick="go(\''+target+'\')"><span class="ico">'+ico+'</span><b>'+title+'</b><small>'+desc+'</small></button>'}
function go(p){if(userRole==='manager'&&!['manager-dashboard','reports'].includes(p)){p='manager-dashboard';toast('هذه الوحدة التشغيلية مخصصة لمسؤول الأمن والوقاية.')}page=p;render();window.scrollTo(0,0)}
function toast(msg){let t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function nextKey(arr){return arr.reduce((m,x)=>Math.max(m,Number(x.key)||0),0)+1}
function fillSubstituteOptions(currentKey,selectedKey,roleOverride){const sel=$('#w-substitute');if(!sel)return;const current=workers.find(x=>Number(x.key)===Number(currentKey));const role=String(roleOverride||(current&&current.role)||($('#w-role')&&$('#w-role').value)||'').trim().toLowerCase();const options=workers.filter(x=>Number(x.key)!==Number(currentKey)&&role&&String(x.role||'').trim().toLowerCase()===role);sel.innerHTML='<option value="">— اختر البديل —</option>'+options.map(x=>'<option value="'+x.key+'">'+esc(x.name)+' · '+esc(x.role)+'</option>').join('');if(selectedKey&&options.some(x=>Number(x.key)===Number(selectedKey)))sel.value=String(selectedKey)}
function workerForm(key){go('worker-form');if(key){let w=workers.find(x=>Number(x.key)===Number(key));if(!w)return;$('#wf-title').textContent='تعديل بيانات العامل';$('#w-key').value=w.key;$('#w-name').value=w.name;$('#w-id').value=w.id||'';$('#w-job').value=w.job||'';$('#w-role').value=w.role||'';$('#w-site').value=w.site||'';$('#w-phone').value=w.phone||'';$('#w-status').value=w.status||'حاضر';$('#w-leave-start').value=w.leaveStart||'';$('#w-leave-end').value=w.leaveEnd||'';$('#w-cycle-start').value=w.cycleStart||'';fillSubstituteOptions(w.key,w.substituteKey)}else{$('#w-cycle-start').value='';fillSubstituteOptions(null,null,$('#w-role').value)}$('#w-role').addEventListener('input',()=>fillSubstituteOptions(Number($('#w-key').value)||null,$('#w-substitute').value,$('#w-role').value))}
let selectedWorkerKey=null;function openWorker(k){selectedWorkerKey=k;go('worker-detail')}function detailRow(label,value){return '<div style="display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px"><span style="color:var(--muted)">'+label+'</span><b style="text-align:left;overflow-wrap:anywhere">'+esc(value)+'</b></div>'}function editWorker(k){workerForm(k)}
function saveWorker(e){e.preventDefault();let key=Number($('#w-key').value);const role=$('#w-role').value.trim();const substituteKey=Number($('#w-substitute').value)||null;const status=$('#w-status').value;const leaveStart=$('#w-leave-start').value;const leaveEnd=$('#w-leave-end').value;const cycleStart=$('#w-cycle-start').value;if(leaveStart&&leaveEnd&&leaveEnd<leaveStart)return toast('تاريخ نهاية الإجازة يجب أن يكون بعد بدايتها');const sub=substituteKey?workers.find(x=>Number(x.key)===substituteKey):null;if(substituteKey&&(!sub||substituteKey===key||!role||String(sub.role||'').trim().toLowerCase()!==role.toLowerCase()))return toast('يجب اختيار بديل آخر في المنصب نفسه');if(substituteKey&&workers.some(x=>Number(x.key)!==key&&Number(x.substituteKey)===substituteKey))return toast('هذا البديل مرتبط بعامل آخر بالفعل');let w={key:key||nextKey(workers),name:$('#w-name').value.trim(),id:$('#w-id').value.trim(),job:$('#w-job').value.trim(),role,site:$('#w-site').value.trim(),phone:$('#w-phone').value.trim(),status,substituteKey,leaveStart,leaveEnd,cycleStart};if(key)workers=workers.map(x=>Number(x.key)===key?w:x);else workers.push(w);save('workers',workers);toast('تم حفظ بيانات العامل والحضور والبديل');go('workers')}
function roomForm(key){go('room-form');let r=key?rooms.find(x=>x.key===key):null;$('#r-key').value=r?r.key:'';$('#r-number').value=r?r.number:'';$('#r-beds').value=r?r.beds:4;$('#delete-room').style.display=r?'inline-block':'none';assignList(r)}
function editRoom(k){roomForm(k)}
function assignList(r){let ids=r?(r.occupants||[]):[];let currentKey=r?r.key:null;let occupiedElsewhere=rooms.filter(x=>x.key!==currentKey).flatMap(x=>x.occupants||[]);let html=workers.length?workers.map(w=>{let checked=ids.includes(w.key),elsewhere=occupiedElsewhere.includes(w.key);return '<label style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px"><input type="checkbox" name="occupant" value="'+w.key+'" '+(checked?'checked ':'')+(elsewhere?'disabled ':'')+'style="accent-color:#d9b46b;width:17px;height:17px"> <span>'+esc(w.name)+' <small style="color:var(--muted)">'+(elsewhere?'(مسكن في غرفة أخرى)':(w.role?'· '+esc(w.role):''))+'</small></span></label>'}).join(''):'<p class="sub">أضف العمال أولاً حتى تتمكن من تسكينهم.</p>';$('#assign-list').innerHTML=html}
function saveRoom(e){e.preventDefault();let key=Number($('#r-key').value),number=Number($('#r-number').value),beds=Number($('#r-beds').value);if(!Number.isInteger(number)||number<1||!Number.isInteger(beds)||beds<1)return toast('تحقق من رقم الغرفة وعدد الأسرة');if(rooms.some(r=>r.number===number&&r.key!==key))return toast('رقم الغرفة مستخدم بالفعل');let occupants=[...document.querySelectorAll('input[name="occupant"]:checked')].map(x=>Number(x.value));if(occupants.length>beds)return toast('عدد العمال أكبر من عدد الأسرة');let elsewhere=rooms.filter(r=>r.key!==key).flatMap(r=>r.occupants||[]);if(occupants.some(id=>elsewhere.includes(id)))return toast('أحد العمال مسجل في غرفة أخرى');let room={key:key||nextKey(rooms),number,beds,occupants};if(key)rooms=rooms.map(r=>r.key===key?room:r);else rooms.push(room);save('rooms',rooms);toast('تم حفظ الغرفة وتوزيع الأسرة');go('housing')}
function deleteRoom(){let key=Number($('#r-key').value);if(!key)return;let r=rooms.find(x=>x.key===key);if(r&&r.occupants.length)return toast('أخرج العمال من الغرفة قبل حذفها');rooms=rooms.filter(x=>x.key!==key);save('rooms',rooms);toast('تم حذف الغرفة');go('housing')}
function shiftForm(){go('shift-form');$('#s-date').value=todayISO();$('#s-site').value=settings.site}
function saveShift(e){e.preventDefault();shifts.push({key:nextKey(shifts),title:$('#s-title').value.trim(),date:$('#s-date').value,site:$('#s-site').value,start:$('#s-start').value,end:$('#s-end').value,notes:$('#s-notes').value.trim()});save('shifts',shifts);toast('تم تسجيل المناوبة');go('shifts')}
function removeShift(k){shifts=shifts.filter(s=>s.key!==k);save('shifts',shifts);render()}
function incidentForm(workerKey){go('incident-form');$('#i-date').value=new Date().toISOString().slice(0,10);if(workerKey){$('#i-worker').value=String(workerKey)}}
function saveIncident(e){e.preventDefault();incidents.push({key:nextKey(incidents),title:$('#i-title').value.trim(),type:$('#i-type').value,workerKey:$('#i-worker').value?Number($('#i-worker').value):null,date:$('#i-date').value,desc:$('#i-desc').value.trim()});save('incidents',incidents);toast('تم تسجيل الملاحظة');go('incidents')}
function removeIncident(k){incidents=incidents.filter(i=>i.key!==k);save('incidents',incidents);render()}
function saveSettings(){settings.site=$('#site-name').value.trim()||'الموقع الرئيسي';save('settings',settings);toast('تم حفظ الإعدادات');render()}
function exportData(){let data={product:'HSE CONTROL',version:1,exportedAt:new Date().toISOString(),workers,rooms,shifts,incidents,settings};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hse-control-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')}
function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d||d.product!=='HSE CONTROL')throw Error('bad');workers=Array.isArray(d.workers)?d.workers:[];rooms=Array.isArray(d.rooms)?d.rooms:[];shifts=Array.isArray(d.shifts)?d.shifts:[];incidents=Array.isArray(d.incidents)?d.incidents:[];settings=d.settings||{site:'الموقع الرئيسي'};['workers','rooms','shifts','incidents','settings'].forEach(k=>save(k,eval(k)));toast('تمت استعادة البيانات');render()}catch(err){toast('الملف غير صالح أو ليس نسخة HSE CONTROL')}};reader.readAsText(f)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{if(!authSession)return;go(b.dataset.page)}));
bootAuth();
